name: Test image

# Builds an evcc test image from this branch and publishes it to ghcr.io/tron4r/evcc.
# The image tag is taken from the git tag on the built commit, e.g. 0.317.1-mbserver-fc41.
# Only used for testing changes on real hardware before or alongside a PR.

# Runs only on tag pushes, so pushing the branch and its tag starts exactly one build.
on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags are needed for the version string

      - name: Image tag from git tag
        id: tag
        run: echo "tag=$(git describe --tags --exact-match)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tron4r/evcc:${{ steps.tag.outputs.tag }}
